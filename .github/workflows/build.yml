name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: sudo apt-get update && sudo apt-get install -y jq python3-yaml
      - name: Build and check installable artifacts
        run: bash scripts/package_target.sh '${{ matrix.minecraft }}'
      - run: bash docker/tests/reset_contract_test.sh
      - run: bash docker/tests/proxy_persistence_test.sh
      - run: python3 docker/tests/proxy_config_test.py
      - run: python3 docker/tests/build_prerequisites_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: linked-hardcore-mc${{ matrix.minecraft }}
          path: |
            fabric-mod/build/libs/*.jar
            fabric-mod/build/${{ matrix.minecraft }}/libs/*.jar
            velocity-plugin/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-mc${{ matrix.minecraft }}
          path: |
            fabric-mod/build/test-results/
            fabric-mod/build/${{ matrix.minecraft }}/test-results/
            velocity-plugin/build/test-results/
